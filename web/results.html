<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title data-i18n="page.resultsTitle">Results · Speedtest</title>
    <link rel="stylesheet" href="/style.css?hash=__STYLE_HASH__">
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">Speedtest</a>
        <nav class="header-actions" aria-label="Site controls"
          data-i18n-aria-label="nav.controls">
          <a class="header-link" href="/" data-i18n="nav.newTest">New test</a>
          <button class="theme" id="theme" type="button"
            aria-label="Switch color theme">
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.5 8.5 0 1 0 20.3 15.4Z" />
            </svg>
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </nav>
      </header>

      <section class="results-page">
        <div class="results-heading">
          <h1 data-i18n="results.title">Results</h1>
          <button class="secondary-button" id="clear"
            type="button" data-i18n="results.clear">Clear</button>
        </div>
        <p class="storage-note" data-i18n="results.storage">Stored only in this browser.</p>

        <p class="empty-results" id="empty" hidden
          data-i18n="results.empty">No saved tests yet.</p>
        <div class="results-table-wrap" id="table-wrap" hidden>
          <table class="results-table">
            <thead>
              <tr>
                <th
                  scope="col"><button class="sort-button" data-sort="timestamp"
                    type="button" data-i18n="results.date">Date</button></th>
                <th scope="col"><button class="sort-button" data-sort="latency"
                    type="button"><span data-i18n="metric.latency">Latency</span><small>ms</small></button></th>
                <th scope="col"><button class="sort-button" data-sort="jitter"
                    type="button"><span data-i18n="metric.jitter">Jitter</span><small>ms</small></button></th>
                <th scope="col"><button class="sort-button" data-sort="download"
                    type="button"><span data-i18n="metric.download">Download</span></button></th>
                <th scope="col"><button class="sort-button" data-sort="upload"
                    type="button"><span data-i18n="metric.upload">Upload</span></button></th>
              </tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>

        <nav class="pagination" id="pagination" aria-label="Results pages"
          data-i18n-aria-label="results.pages"
          hidden>
          <button class="secondary-button" id="previous"
            type="button" data-i18n="results.previous">Previous</button>
          <span id="page"></span>
          <button class="secondary-button" id="next" type="button"
            data-i18n="results.next">Next</button>
        </nav>
      </section>

      <footer>
        <a class="source" href="https://github.com/EriksRemess/speedtest"
          target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 .2a8 8 0 0 0-2.5 15.6c.4.1.5-.2.5-.4v-1.5c-2 .4-2.5-.9-2.5-.9-.3-.8-.8-1-1-1.1-.7-.5.1-.5.1-.5.7.1 1.2.8 1.2.8.7 1.2 1.8.9 2.2.7.1-.5.3-.9.5-1.1-1.6-.2-3.3-.8-3.3-3.6 0-.9.3-1.6.8-2.2-.1-.2-.4-1 .1-2.2 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.5 1.2.2 2 .1 2.2.5.6.8 1.3.8 2.2 0 2.8-1.7 3.4-3.3 3.6.3.2.5.7.5 1.3v2c0 .2.1.5.5.4A8 8 0 0 0 8 .2Z" />
          </svg>
          <span>EriksRemess/speedtest</span>
        </a>
        <div class="footer-meta">
          <span id="host"></span>
          <label class="language-selector">
            <span class="visually-hidden" data-i18n="language.label">Language</span>
            <select id="language" data-i18n-aria-label="language.label">
              <option value="en" lang="en">English</option>
              <option value="lv" lang="lv">Latviešu</option>
            </select>
          </label>
        </div>
      </footer>
    </main>
    <script src="/locales/en.js?hash=__LOCALE_EN_HASH__" defer></script>
    <script src="/locales/lv.js?hash=__LOCALE_LV_HASH__" defer></script>
    <script src="/i18n.js?hash=__I18N_HASH__" defer></script>
    <script src="/chart.js?hash=__CHART_HASH__" defer></script>
    <script src="/results.js?hash=__RESULTS_HASH__" defer></script>
  </body>
</html>
