<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Speedtest</title>
    <link rel="stylesheet" href="/style.css?hash=__STYLE_HASH__">
  </head>
  <body>
    <main>
      <header>
        <strong>Speedtest</strong>
        <button class="theme" id="theme" type="button"
          aria-label="Switch color theme">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.3 15.4A8.5 8.5 0 0 1 8.6 3.7 8.5 8.5 0 1 0 20.3 15.4Z" />
          </svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </header>
      <section class="test" aria-live="polite">
        <ol class="stages" aria-label="Test stages">
          <li id="stage-latency"><b>1</b><span>Latency</span></li>
          <li id="stage-download"><b>2</b><span>Download</span></li>
          <li id="stage-upload"><b>3</b><span>Upload</span></li>
        </ol>
        <div class="reading" id="reading" hidden>
          <div><strong id="speed">—</strong> <small id="unit">Mbps</small></div>
          <span id="phase">Ready</span>
        </div>
        <div class="progress" id="progress-track" aria-hidden="true" hidden>
          <i id="progress"></i>
        </div>
        <button id="start"><span>Start test</span></button>
        <div class="metrics" id="metrics" hidden>
          <article><span>Latency</span><div><strong id="latency">—</strong><small>ms</small></div></article>
          <article><span>Jitter</span><div><strong id="jitter">—</strong><small>ms</small></div></article>
          <article><span>Download</span><div><strong id="download">—</strong><small>Mbps</small></div></article>
          <article><span>Upload</span><div><strong id="upload">—</strong><small>Mbps</small></div></article>
        </div>
      </section>
      <footer>
        <a class="source" href="https://github.com/EriksRemess/speedtest"
          target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 .2a8 8 0 0 0-2.5 15.6c.4.1.5-.2.5-.4v-1.5c-2 .4-2.5-.9-2.5-.9-.3-.8-.8-1-1-1.1-.7-.5.1-.5.1-.5.7.1 1.2.8 1.2.8.7 1.2 1.8.9 2.2.7.1-.5.3-.9.5-1.1-1.6-.2-3.3-.8-3.3-3.6 0-.9.3-1.6.8-2.2-.1-.2-.4-1 .1-2.2 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.5 1.2.2 2 .1 2.2.5.6.8 1.3.8 2.2 0 2.8-1.7 3.4-3.3 3.6.3.2.5.7.5 1.3v2c0 .2.1.5.5.4A8 8 0 0 0 8 .2Z" />
          </svg>
          <span>EriksRemess/speedtest</span>
        </a>
        <span id="host"></span>
      </footer>
    </main>
    <script src="/app.js?hash=__APP_HASH__" defer></script>
  </body>
</html>
