name: Publish container

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/eriksremess/speedtest

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --release
          for script in web/*.js web/locales/*.js; do node --check "$script"; done
          node --test tests/*.test.js

      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          COMMIT_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          podman build \
            --pull=always \
            --file Containerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$COMMIT_IMAGE" \
            .

      - name: Push commit image
        run: podman push "${IMAGE}:sha-${{ github.sha }}"

      - name: Push latest image
        if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        run: |
          podman tag "${IMAGE}:sha-${{ github.sha }}" "${IMAGE}:latest"
          podman push "${IMAGE}:latest"

      - name: Log out of GitHub Container Registry
        if: always()
        run: podman logout ghcr.io || true
